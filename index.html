<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жанна 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: linear-gradient(160deg, #0a1628 0%, #1a3a4a 20%, #2d5a6b 40%, #6b3a7a 65%, #e8a0bf 85%, #ffd6e8 100%);
        }

        /* Aurora glow */
        .aurora {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 80%, rgba(100, 200, 220, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 20%, rgba(232, 160, 191, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse 50% 60% at 50% 50%, rgba(45, 90, 107, 0.35) 0%, transparent 70%);
            animation: auroraShift 12s ease-in-out infinite alternate;
        }

        @keyframes auroraShift {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* Stars / sparkles */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* Floating background layer */
        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .lotus {
            position: absolute;
            opacity: 0.65;
            animation: lotusFloat linear infinite;
            filter: drop-shadow(0 6px 16px rgba(232, 160, 191, 0.5));
        }

        @keyframes lotusFloat {
            0% {
                transform: translateY(110vh) translateX(0) rotate(0deg) scale(0.85);
                opacity: 0;
            }
            8% { opacity: 0.65; }
            50% { transform: translateY(50vh) translateX(30px) rotate(8deg) scale(1); }
            92% { opacity: 0.65; }
            100% {
                transform: translateY(-120px) translateX(-20px) rotate(-5deg) scale(1.05);
                opacity: 0;
            }
        }

        .bunny {
            position: absolute;
            font-size: 48px;
            opacity: 0.7;
            animation: bunnyHop linear infinite;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.2));
        }

        @keyframes bunnyHop {
            0% {
                transform: translateY(110vh) translateX(0) scaleX(1);
                opacity: 0;
            }
            8% { opacity: 0.7; }
            25% { transform: translateY(75vh) translateX(20px) scaleX(1); }
            30% { transform: translateY(72vh) translateX(20px) scaleX(1) scaleY(1.1); }
            35% { transform: translateY(75vh) translateX(25px) scaleX(1); }
            50% { transform: translateY(50vh) translateX(-15px) scaleX(-1); }
            55% { transform: translateY(47vh) translateX(-15px) scaleX(-1) scaleY(1.1); }
            60% { transform: translateY(50vh) translateX(-20px) scaleX(-1); }
            75% { transform: translateY(25vh) translateX(10px) scaleX(1); }
            80% { transform: translateY(22vh) translateX(10px) scaleX(1) scaleY(1.1); }
            85% { transform: translateY(25vh) translateX(15px) scaleX(1); }
            92% { opacity: 0.7; }
            100% {
                transform: translateY(-80px) translateX(0) scaleX(1);
                opacity: 0;
            }
        }

        .petal {
            position: absolute;
            width: 14px;
            height: 10px;
            background: linear-gradient(135deg, #ffd6e8, #e8a0bf);
            border-radius: 50% 50% 40% 40%;
            opacity: 0.45;
            animation: petalDrift linear infinite;
        }

        @keyframes petalDrift {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Corner lotus (SVG) */
        .corner-lotus {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        .corner-lotus.top-left { top: 10px; left: 10px; }
        .corner-lotus.top-right { top: 10px; right: 10px; transform: scaleX(-1); }
        .corner-lotus.bottom-left { bottom: 10px; left: 10px; }
        .corner-lotus.bottom-right { bottom: 10px; right: 10px; transform: scaleX(-1); }

        .container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            padding: 50px 70px;
            border-radius: 32px;
            box-shadow:
                0 25px 80px rgba(26, 10, 46, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 640px;
            position: relative;
            z-index: 1;
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .container::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 35px;
            background: linear-gradient(135deg, #ffb6c1, #c4717a, #6b3a7a, #ffb6c1);
            z-index: -1;
            opacity: 0.6;
        }

        @keyframes slideIn {
            from { transform: translateY(-60px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .bunnies-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .bunny-icon {
            font-size: 52px;
            animation: bunnyBounce 2s ease-in-out infinite;
        }

        .bunny-icon:nth-child(2) { animation-delay: 0.3s; }
        .bunny-icon:nth-child(3) { animation-delay: 0.6s; }

        @keyframes bunnyBounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            font-weight: 700;
            line-height: 1.25;
            background: linear-gradient(135deg, #6b3a7a 0%, #c4717a 50%, #e91e63 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .love-line {
            font-family: 'Cormorant Garamond', serif;
            font-size: 44px;
            font-weight: 700;
            color: #e91e63;
            margin-bottom: 12px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .question-line {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            color: #6b3a7a;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 17px;
            color: #888;
            margin-bottom: 36px;
            font-style: italic;
        }

        .lotus-divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            font-size: 28px;
        }

        .lotus-divider span {
            animation: sway 3s ease-in-out infinite;
        }

        .lotus-divider span:nth-child(2) { animation-delay: 0.5s; }
        .lotus-divider span:nth-child(3) { animation-delay: 1s; }

        @keyframes sway {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            position: relative;
        }

        button {
            padding: 18px 50px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            font-family: inherit;
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ff6b9d 100%);
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        }

        .yes-btn:hover {
            transform: scale(1.12);
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.45);
        }

        .yes-btn:active { transform: scale(1.05); }

        .no-btn-wrapper {
            position: relative;
            width: 150px;
            height: 60px;
        }

        .no-btn {
            background: linear-gradient(135deg, #e8d5f0 0%, #f5e6ff 100%);
            color: #6b3a7a;
            transition: all 0.2s ease;
        }

        .no-btn:hover { transform: scale(1.05); }
        .no-btn.running { position: absolute; }

        .success {
            display: none;
            animation: celebrateIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes celebrateIn {
            from { transform: scale(0.4) rotate(-8deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .success h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            color: #e91e63;
            margin-bottom: 12px;
        }

        .success p {
            font-size: 20px;
            color: #666;
        }

        .celebration {
            font-size: 56px;
            margin-bottom: 16px;
            letter-spacing: 8px;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 10;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            body { padding: 16px; }

            .container {
                padding: 32px 24px;
                border-radius: 24px;
            }

            .bunny-icon { font-size: 38px; }

            h1 { font-size: 28px; }
            .love-line { font-size: 32px; }
            .question-line { font-size: 24px; }

            .subtitle { font-size: 15px; margin-bottom: 28px; }

            .buttons {
                flex-direction: column;
                gap: 15px;
                min-height: 200px;
            }

            button {
                padding: 15px 40px;
                font-size: 18px;
                width: 100%;
                max-width: 220px;
            }

            .no-btn-wrapper { width: 220px; height: 50px; }

            .success h2 { font-size: 32px; }
            .celebration { font-size: 40px; letter-spacing: 4px; }

            .corner-lotus { opacity: 0.25; transform: scale(0.65); }
            .corner-lotus.top-right, .corner-lotus.bottom-right { transform: scaleX(-1) scale(0.65); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 24px; }
            .love-line { font-size: 28px; }
            .question-line { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="stars" id="stars"></div>
    <div class="bg-layer" id="bgLayer"></div>

    <!-- Corner lotus SVG -->
    <svg class="corner-lotus top-left" width="160" height="140" viewBox="0 0 160 140" fill="none">
        <ellipse cx="80" cy="120" rx="55" ry="14" fill="#2d6a4f" opacity="0.7"/>
        <ellipse cx="80" cy="118" rx="48" ry="10" fill="#40916c" opacity="0.5"/>
        <path d="M80 95 Q72 80 68 65 Q64 50 70 38 Q76 28 80 22" stroke="#52b788" stroke-width="2" fill="none" opacity="0.6"/>
        <path d="M80 55 Q65 50 55 42 Q48 36 52 32 Q62 28 72 38 Q78 44 80 55" fill="#ffd6e8" stroke="#e8a0bf" stroke-width="0.8"/>
        <path d="M80 55 Q95 50 105 42 Q112 36 108 32 Q98 28 88 38 Q82 44 80 55" fill="#ffe4f0" stroke="#e8a0bf" stroke-width="0.8"/>
        <path d="M80 55 Q70 38 68 28 Q66 20 72 22 Q78 26 80 40" fill="#fff0f5" stroke="#ffb6c1" stroke-width="0.8"/>
        <path d="M80 55 Q90 38 92 28 Q94 20 88 22 Q82 26 80 40" fill="#fff0f5" stroke="#ffb6c1" stroke-width="0.8"/>
        <path d="M80 55 Q78 35 80 25 Q82 18 80 22 Q78 30 80 45" fill="#fffafa" stroke="#ffd6e8" stroke-width="0.8"/>
        <circle cx="80" cy="48" r="6" fill="#ffd700" opacity="0.9"/>
        <circle cx="77" cy="46" r="1.5" fill="#ff8c00"/>
        <circle cx="83" cy="46" r="1.5" fill="#ff8c00"/>
        <circle cx="80" cy="50" r="1.5" fill="#ff8c00"/>
    </svg>
    <svg class="corner-lotus top-right" width="160" height="140" viewBox="0 0 160 140" fill="none">
        <ellipse cx="80" cy="120" rx="55" ry="14" fill="#2d6a4f" opacity="0.7"/>
        <path d="M80 55 Q65 50 55 42 Q48 36 52 32 Q62 28 72 38 Q78 44 80 55" fill="#ffd6e8" stroke="#e8a0bf" stroke-width="0.8"/>
        <path d="M80 55 Q95 50 105 42 Q112 36 108 32 Q98 28 88 38 Q82 44 80 55" fill="#ffe4f0" stroke="#e8a0bf" stroke-width="0.8"/>
        <path d="M80 55 Q78 35 80 25 Q82 18 80 22 Q78 30 80 45" fill="#fffafa" stroke="#ffd6e8" stroke-width="0.8"/>
        <circle cx="80" cy="48" r="6" fill="#ffd700"/>
    </svg>
    <svg class="corner-lotus bottom-left" width="140" height="120" viewBox="0 0 160 140" fill="none">
        <ellipse cx="80" cy="120" rx="55" ry="14" fill="#2d6a4f" opacity="0.6"/>
        <path d="M80 55 Q65 50 55 42 Q48 36 52 32 Q62 28 72 38 Q78 44 80 55" fill="#ffd6e8" stroke="#e8a0bf" stroke-width="0.8"/>
        <path d="M80 55 Q95 50 105 42 Q112 36 108 32 Q98 28 88 38 Q82 44 80 55" fill="#ffe4f0" stroke="#e8a0bf" stroke-width="0.8"/>
        <circle cx="80" cy="48" r="6" fill="#ffd700"/>
    </svg>
    <svg class="corner-lotus bottom-right" width="140" height="120" viewBox="0 0 160 140" fill="none">
        <ellipse cx="80" cy="120" rx="55" ry="14" fill="#2d6a4f" opacity="0.6"/>
        <path d="M80 55 Q70 38 68 28 Q66 20 72 22 Q78 26 80 40" fill="#fff0f5" stroke="#ffb6c1" stroke-width="0.8"/>
        <path d="M80 55 Q90 38 92 28 Q94 20 88 22 Q82 26 80 40" fill="#fff0f5" stroke="#ffb6c1" stroke-width="0.8"/>
        <path d="M80 55 Q78 35 80 25 Q82 18 80 22 Q78 30 80 45" fill="#fffafa" stroke="#ffd6e8" stroke-width="0.8"/>
        <circle cx="80" cy="48" r="6" fill="#ffd700"/>
    </svg>

    <div class="container">
        <div class="question" id="question">
            <div class="bunnies-header">
                <span class="bunny-icon">🐰</span>
                <span class="bunny-icon">💕</span>
                <span class="bunny-icon">🐇</span>
            </div>

            <h1>ЖАННА</h1>
            <p class="love-line">Я ТЕБЯ ЛЮБЛЮ</p>
            <p class="question-line">БУДЕШЬ СО МНОЙ?</p>

            <div class="lotus-divider">
                <span>🪷</span>
                <span>💕</span>
                <span>🪷</span>
            </div>

            <p class="subtitle">Родная, сделай правильный выбор ✨</p>

            <div class="buttons">
                <button class="yes-btn" onclick="sayYes()">Да! 💕</button>
                <div class="no-btn-wrapper">
                    <button class="no-btn" id="noBtn" onmouseover="runAway()" onclick="runAway()">Нет</button>
                </div>
            </div>
        </div>

        <div class="success" id="success">
            <div class="celebration">🐰🪷💕🪷🐰</div>
            <h2>Урааааа! 😊</h2>
            <p>Ты сделала меня самым счастливым!</p>
        </div>
    </div>

    <script>
        // SVG lotus template
        function createLotusSVG(size) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size * 0.9);
            svg.setAttribute('viewBox', '0 0 80 72');
            svg.innerHTML = `
                <ellipse cx="40" cy="62" rx="34" ry="8" fill="#2d6a4f" opacity="0.65"/>
                <ellipse cx="40" cy="60" rx="28" ry="6" fill="#40916c" opacity="0.4"/>
                <path d="M40 48 Q28 44 20 36 Q14 30 18 26 Q26 22 34 32 Q38 38 40 48" fill="#ffd6e8" stroke="#e8a0bf" stroke-width="0.7"/>
                <path d="M40 48 Q52 44 60 36 Q66 30 62 26 Q54 22 46 32 Q42 38 40 48" fill="#ffe4f0" stroke="#e8a0bf" stroke-width="0.7"/>
                <path d="M40 48 Q32 32 30 22 Q28 14 34 16 Q38 20 40 34" fill="#fff0f5" stroke="#ffb6c1" stroke-width="0.7"/>
                <path d="M40 48 Q48 32 50 22 Q52 14 46 16 Q42 20 40 34" fill="#fff0f5" stroke="#ffb6c1" stroke-width="0.7"/>
                <path d="M40 48 Q36 28 38 18 Q40 12 40 16 Q40 24 40 38" fill="#fffafa" stroke="#ffd6e8" stroke-width="0.7"/>
                <path d="M40 48 Q44 28 42 18 Q40 12 40 16 Q40 24 40 38" fill="#fff5f8" stroke="#ffd6e8" stroke-width="0.7"/>
                <path d="M40 48 Q38 36 40 28 Q42 22 40 24 Q38 30 40 42" fill="#fffafa" stroke="#ffb6c1" stroke-width="0.6"/>
                <circle cx="40" cy="40" r="5" fill="#ffd700" opacity="0.95"/>
                <circle cx="37" cy="38" r="1.2" fill="#ff8c00"/>
                <circle cx="43" cy="38" r="1.2" fill="#ff8c00"/>
                <circle cx="40" cy="42" r="1.2" fill="#ff8c00"/>
            `;
            return svg;
        }

        const bgLayer = document.getElementById('bgLayer');
        const starsEl = document.getElementById('stars');

        // Stars
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 2 + 2) + 's';
            starsEl.appendChild(star);
        }

        // Floating lotuses
        function spawnLotus() {
            const wrapper = document.createElement('div');
            wrapper.className = 'lotus';
            const size = Math.random() * 45 + 35;
            wrapper.appendChild(createLotusSVG(size));
            wrapper.style.left = Math.random() * 100 + '%';
            wrapper.style.animationDuration = (Math.random() * 15 + 18) + 's';
            wrapper.style.animationDelay = Math.random() * 3 + 's';
            bgLayer.appendChild(wrapper);
            setTimeout(() => wrapper.remove(), 35000);
        }

        // Floating bunnies
        const bunnyEmojis = ['🐰', '🐇', '🐰💕', '💕🐇'];
        function spawnBunny() {
            const bunny = document.createElement('div');
            bunny.className = 'bunny';
            bunny.textContent = bunnyEmojis[Math.floor(Math.random() * bunnyEmojis.length)];
            bunny.style.left = Math.random() * 85 + 5 + '%';
            bunny.style.fontSize = (Math.random() * 24 + 36) + 'px';
            bunny.style.animationDuration = (Math.random() * 12 + 20) + 's';
            bunny.style.animationDelay = Math.random() * 4 + 's';
            bgLayer.appendChild(bunny);
            setTimeout(() => bunny.remove(), 40000);
        }

        // Falling petals
        function spawnPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = (Math.random() * 8 + 10) + 's';
            petal.style.animationDelay = Math.random() * 2 + 's';
            petal.style.transform = `rotate(${Math.random() * 360}deg)`;
            bgLayer.appendChild(petal);
            setTimeout(() => petal.remove(), 20000);
        }

        setInterval(spawnLotus, 2200);
        setInterval(spawnBunny, 4500);
        setInterval(spawnPetal, 600);

        for (let i = 0; i < 8; i++) setTimeout(spawnLotus, i * 400);
        for (let i = 0; i < 4; i++) setTimeout(spawnBunny, i * 800);
        for (let i = 0; i < 20; i++) setTimeout(spawnPetal, i * 200);

        // No button
        const noBtn = document.getElementById('noBtn');
        let moveCount = 0;

        function runAway() {
            if (moveCount === 0) noBtn.classList.add('running');

            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            const maxX = containerRect.width - btnRect.width - 40;
            const maxY = 200;

            noBtn.style.left = (Math.random() * maxX - maxX / 2) + 'px';
            noBtn.style.top = (Math.random() * maxY - maxY / 2) + 'px';
            moveCount++;

            if (moveCount > 3) {
                noBtn.style.transform = `scale(${Math.max(0.5, 1 - moveCount * 0.1)})`;
            }

            const texts = ['Нет', 'Нет', 'Нет', 'Нет', 'Ало, всмысле?', 'Неправильный вариант', 'Ты чего....', 'Ну уж нет', 'Сдавайся 🐰'];
            if (moveCount < texts.length) noBtn.textContent = texts[moveCount];
        }

        function sayYes() {
            createConfetti();
            document.getElementById('question').style.display = 'none';
            document.getElementById('success').style.display = 'block';

            for (let i = 0; i < 30; i++) setTimeout(spawnLotus, i * 120);
            for (let i = 0; i < 15; i++) setTimeout(spawnBunny, i * 200);
        }

        function createConfetti() {
            const colors = ['#ffd6e8', '#e8a0bf', '#ffb6c1', '#40916c', '#6b3a7a', '#ffd700', '#fff5f8'];
            for (let i = 0; i < 120; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    confetti.style.width = (Math.random() * 8 + 6) + 'px';
                    confetti.style.height = (Math.random() * 8 + 6) + 'px';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 25);
            }
        }
    </script>
</body>
</html>
